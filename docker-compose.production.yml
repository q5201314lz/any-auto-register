services:
  app:
    container_name: any-auto-register
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
      VNC_PASSWORD: ${VNC_PASSWORD}
      ACCOUNT_MANAGER_TUN_PROXY: "off"
      ACCOUNT_MANAGER_DISABLE_SYSTEM_PROXY: "1"
      TZ: UTC
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
